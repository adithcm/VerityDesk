services:
  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: sqlite:///./data/investoragent.db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
