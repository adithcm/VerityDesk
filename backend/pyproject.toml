[project]
name = "investoragent-backend"
version = "0.1.0"
description = "FastAPI backend for InvestorAgent."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "certifi>=2024.7",
  "fastapi>=0.111,<0.112",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic-settings>=2.3,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.5,<0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]
