<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">VerityDesk app icon</title>
  <desc id="desc">A dark futuristic VerityDesk icon with cyan data grid, lime signal core, and angular V-shaped desk mark.</desc>
  <defs>
    <linearGradient id="bg" x1="126" y1="102" x2="887" y2="922" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.5" stop-color="#020617"/>
      <stop offset="1" stop-color="#061320"/>
    </linearGradient>
    <linearGradient id="frame" x1="192" y1="163" x2="832" y2="861" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="mark" x1="292" y1="242" x2="749" y2="777" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="0.52" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(701 266) rotate(124) scale(443 424)">
      <stop stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLime" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 728) rotate(-35) scale(408 296)">
      <stop stop-color="#a3e635" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="34" stdDeviation="45" flood-color="#000814" flood-opacity="0.56"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#22d3ee" flood-opacity="0.16"/>
    </filter>
    <filter id="signalGlow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#a3e635" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="42" flood-color="#22d3ee" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#22d3ee" stroke-opacity="0.09" stroke-width="3"/>
    </pattern>
    <clipPath id="rounded">
      <rect x="64" y="64" width="896" height="896" rx="214"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect x="64" y="64" width="896" height="896" rx="214" fill="url(#bg)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#grid)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#glowCyan)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#glowLime)"/>
    <path d="M187 706C279 630 333 523 365 388C387 294 463 238 561 248C681 260 767 350 787 465C805 571 757 661 675 732" fill="none" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="28" stroke-linecap="round"/>
    <path d="M226 322H798" stroke="#22d3ee" stroke-opacity="0.13" stroke-width="8" stroke-linecap="round"/>
    <path d="M226 704H798" stroke="#a3e635" stroke-opacity="0.15" stroke-width="8" stroke-linecap="round"/>
  </g>

  <rect x="82" y="82" width="860" height="860" rx="196" fill="none" stroke="url(#frame)" stroke-opacity="0.72" stroke-width="18"/>
  <rect x="118" y="118" width="788" height="788" rx="168" fill="none" stroke="#1d3558" stroke-opacity="0.75" stroke-width="6"/>

  <g filter="url(#softShadow)">
    <path d="M262 340C262 314 283 293 309 293H715C741 293 762 314 762 340V641C762 667 741 688 715 688H309C283 688 262 667 262 641V340Z" fill="#020617" fill-opacity="0.82" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="10"/>
    <path d="M338 390L487 674C497 693 527 693 537 674L686 390H603L512 574L421 390H338Z" fill="url(#mark)"/>
    <path d="M345 724H679" stroke="#a3e635" stroke-width="34" stroke-linecap="round"/>
    <path d="M414 781H610" stroke="#22d3ee" stroke-opacity="0.72" stroke-width="20" stroke-linecap="round"/>
  </g>

  <g filter="url(#signalGlow)">
    <circle cx="716" cy="306" r="34" fill="#a3e635"/>
    <circle cx="716" cy="306" r="10" fill="#f8fafc"/>
  </g>

  <circle cx="309" cy="306" r="13" fill="#22d3ee" opacity="0.95"/>
  <circle cx="309" cy="648" r="13" fill="#f472b6" opacity="0.82"/>
  <circle cx="715" cy="648" r="13" fill="#22d3ee" opacity="0.72"/>
</svg>

